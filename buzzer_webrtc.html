<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1"
  />

  <title>Buzzer</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      background:
        radial-gradient(
          ellipse at top,
          #0f4c81 0%,
          #031533 60%,
          #010a1a 100%
        );
      color: #fff;
      font-family: sans-serif;
    }

    .header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      opacity: 0.8;
      font-family: monospace;
      color: #ffeb85;
      flex-shrink: 0;
    }

    #team-title {
      font-size: 40px;
      font-weight: 900;
      text-align: center;
      margin: 15px 0 5px 0;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
      text-transform: uppercase;
      letter-spacing: 2px;
      flex-shrink: 0;
    }

    #status-text {
      text-align: center;
      font-size: 18px;
      margin-bottom: 20px;
      color: #ffeb85;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      opacity: 0.9;
      min-height: 22px;
      flex-shrink: 0;
    }

    .wood-board {
      flex: 1;
      min-height: 0;
      margin: 10px 0;
      border: 6px solid #ffd700;
      border-radius: 30px;
      background: #5c3a21;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 15px,
          rgba(0, 0, 0, 0.1) 15px,
          rgba(0, 0, 0, 0.1) 30px
        ),
        linear-gradient(180deg, #6b4324, #2a170a);
      box-shadow:
        0 0 30px rgba(255, 215, 0, 0.5),
        inset 0 0 40px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .buzzer-container {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at center,
          rgba(255, 215, 0, 0.1) 0%,
          transparent 60%
        );
      width: 100%;
      height: 100%;
    }

    .podium {
      --size: min(80vw, 55vh, 300px);

      width: var(--size);
      height: var(--size);

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #0d47a1,
          #0a1f44
        );

      box-shadow:
        0 30px 60px -15px rgba(0, 0, 0, 1),
        inset 0 4px 8px rgba(255, 255, 255, 0.3),
        inset 0 -5px 15px rgba(0, 0, 0, 0.9);

      display: flex;
      align-items: center;
      justify-content: center;

      border: 3px solid #06193b;
      position: relative;
    }

    .podium::after {
      content: "";

      position: absolute;

      width: calc(var(--size) - 20px);
      height: calc(var(--size) - 20px);

      border-radius: 50%;

      background:
        linear-gradient(
          to bottom,
          #1565c0,
          #0a2656
        );

      box-shadow:
        inset 0 5px 15px rgba(0, 0, 0, 0.8);

      z-index: 1;
    }

    #buzz-btn {
      width: calc(var(--size) - 60px);
      height: calc(var(--size) - 60px);

      border-radius: 50%;

      border: 2px solid rgba(0, 0, 0, 0.5);

      font-size: 32px;
      font-weight: 900;

      color: rgba(255, 255, 255, 0.5);

      background:
        radial-gradient(
          circle at 35% 35%,
          #b71c1c,
          #4a0404
        );

      box-shadow:
        0 20px 30px rgba(0, 0, 0, 0.9),
        inset 0 -15px 25px rgba(0, 0, 0, 0.7),
        inset 0 10px 20px rgba(255, 255, 255, 0.2);

      transition:
        all 0.1s cubic-bezier(0.4, 0, 0.2, 1);

      text-shadow:
        0 -1px 2px rgba(0, 0, 0, 0.8);

      position: relative;

      top: -10px;

      z-index: 2;

      outline: none;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }

    #buzz-btn.countdown {
      opacity: 0.9;

      background:
        radial-gradient(
          circle at 35% 35%,
          #fde047,
          #ca8a04
        );

      color: #000;

      font-size: 48px;

      box-shadow:
        0 15px 25px rgba(0, 0, 0, 0.6),
        0 0 50px #eab308,
        inset 0 -15px 25px rgba(0, 0, 0, 0.4),
        inset 0 15px 25px rgba(255, 255, 255, 0.5);
    }

    #buzz-btn.armed {
      color: #fff;

      background:
        radial-gradient(
          circle at 35% 35%,
          #ff4d4d,
          #d32f2f
        );

      box-shadow:
        0 15px 25px rgba(0, 0, 0, 0.6),
        0 0 50px #ff0000,
        inset 0 -15px 25px rgba(0, 0, 0, 0.4),
        inset 0 15px 25px rgba(255, 255, 255, 0.6);

      top: -10px;

      cursor: pointer;
    }

    #buzz-btn.armed:active {
      top: 0;

      box-shadow:
        0 5px 10px rgba(0, 0, 0, 0.8),
        0 0 60px #ff0000,
        inset 0 -5px 15px rgba(0, 0, 0, 0.6),
        inset 0 5px 15px rgba(255, 255, 255, 0.5);
    }

    #buzz-btn.winner {
      color: #fff;

      background:
        radial-gradient(
          circle at 35% 35%,
          #86efac,
          #22c55e
        ) !important;

      box-shadow:
        0 5px 10px rgba(0, 0, 0, 0.8),
        0 0 100px #22c55e,
        inset 0 -5px 15px rgba(0, 0, 0, 0.6),
        inset 0 5px 15px rgba(255, 255, 255, 0.6) !important;

      top: 0;
    }

    #buzz-btn:disabled {
      cursor: default;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      #team-title {
        font-size: 30px;
        margin-top: 10px;
      }

      #status-text {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .wood-board {
        border-width: 4px;
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <span>
      Room:
      <b id="room-lbl">-</b>
    </span>

    <span id="conn-lbl">
      Connecting...
    </span>
  </div>


  <div id="team-title">
    TEAM
  </div>


  <div id="status-text">
    Connecting to host...
  </div>


  <div class="wood-board">

    <div class="buzzer-container">

      <div class="podium">

        <button
          id="buzz-btn"
          disabled
          type="button"
        >
          STANDBY
        </button>

      </div>

    </div>

  </div>


  <script>

    /* ============================================================
       CONFIGURATION
       ============================================================ */

    const SIGNALING_HOST =
      "feud-backend.feud-buzz-app.workers.dev";


    const RTC_CONFIG = {

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        },

        {
          urls:
            "stun:stun1.l.google.com:19302"
        }

      ]

    };


    /* ============================================================
       URL PARAMETERS
       ============================================================ */

    const params =
      new URLSearchParams(
        window.location.search
      );


    let room =
      params.get("room");


    let team =
      params.get("team");


    let name =
      params.get("name");


    let color =
      params.get("color");


    /* ============================================================
       LOAD / SAVE PHONE SETTINGS
       ============================================================ */

    if (room) {

      room =
        room.toUpperCase();


      localStorage.setItem(
        "feud_room",
        room
      );


      if (team !== null) {

        localStorage.setItem(
          "feud_team",
          team
        );

      }


      if (name) {

        localStorage.setItem(
          "feud_name",
          name
        );

      }


      if (color) {

        localStorage.setItem(
          "feud_color",
          color
        );

      }

    } else {

      room =
        (
          localStorage.getItem(
            "feud_room"
          ) || ""
        ).toUpperCase();


      team =
        localStorage.getItem(
          "feud_team"
        ) || "0";


      name =
        localStorage.getItem(
          "feud_name"
        ) ||
        `Team ${parseInt(team) + 1}`;


      color =
        localStorage.getItem(
          "feud_color"
        ) ||
        "#3b82f6";

    }


    /* ============================================================
       VALIDATE ROOM
       ============================================================ */

    if (
      !room ||
      room.length !== 4
    ) {

      document
        .getElementById(
          "status-text"
        )
        .textContent =
          "Invalid room. Please scan QR again.";


      document
        .getElementById(
          "conn-lbl"
        )
        .textContent =
          "No Room";


      throw new Error(
        "Invalid room code"
      );

    }


    team =
      Number(team);


    if (
      team !== 0 &&
      team !== 1
    ) {

      document
        .getElementById(
          "status-text"
        )
        .textContent =
          "Invalid team. Please scan QR again.";


      throw new Error(
        "Invalid team"
      );

    }


    /* ============================================================
       UI REFERENCES
       ============================================================ */

    const btn =
      document.getElementById(
        "buzz-btn"
      );


    const status =
      document.getElementById(
        "status-text"
      );


    const connLbl =
      document.getElementById(
        "conn-lbl"
      );


    const roomLbl =
      document.getElementById(
        "room-lbl"
      );


    const teamTitle =
      document.getElementById(
        "team-title"
      );


    roomLbl.textContent =
      room;


    teamTitle.textContent =
      name ||
      `TEAM ${team + 1}`;


    teamTitle.style.color =
      color ||
      "#ffffff";


    /* ============================================================
       STATE
       ============================================================ */

    let signalingWs =
      null;


    let peer =
      null;


    let channel =
      null;


    let remoteDescriptionSet =
      false;


    let pendingCandidates =
      [];


    let reconnectTimer =
      null;


    let retryDelay =
      1000;


    const MAX_RETRY_DELAY =
      15000;


    let phoneArmed =
      false;


    let phoneBuzzed =
      false;


    /* ============================================================
       PHONE UI
       ============================================================ */

    function setStandby(
      message =
        "Waiting for host..."
    ) {

      phoneArmed =
        false;


      phoneBuzzed =
        false;


      btn.disabled =
        true;


      btn.className =
        "";


      btn.textContent =
        "STANDBY";


      status.textContent =
        message;

    }


    function setArmed() {

      phoneArmed =
        true;


      phoneBuzzed =
        false;


      btn.disabled =
        false;


      btn.className =
        "armed";


      btn.textContent =
        "BUZZ!";


      status.textContent =
        "TAP NOW!";


      if (
        navigator.vibrate
      ) {

        navigator.vibrate(
          [80, 40, 80]
        );

      }

    }


    function setLocked(
      winnerTeam
    ) {

      phoneArmed =
        false;


      btn.disabled =
        true;


      btn.classList.remove(
        "armed",
        "countdown"
      );


      /*
       * If the host did not send a winner,
       * simply lock the buzzer.
       */

      if (
        winnerTeam === undefined ||
        winnerTeam === null
      ) {

        btn.textContent =
          "LOCKED";

        status.textContent =
          "Waiting for host...";

        return;

      }


      if (
        Number(winnerTeam) === team
      ) {

        btn.classList.add(
          "winner"
        );


        btn.textContent =
          "YOU BUZZED!";


        status.textContent =
          "You got in first!";


        if (
          navigator.vibrate
        ) {

          navigator.vibrate(
            [100, 50, 100]
          );

        }

      } else {

        btn.textContent =
          "LOCKED OUT";


        status.textContent =
          "Other team buzzed first!";

      }

    }


    /* ============================================================
       SEND SIGNALING MESSAGE
       ============================================================ */

    function sendSignal(
      data
    ) {

      if (
        !signalingWs ||
        signalingWs.readyState !==
          WebSocket.OPEN
      ) {

        console.warn(
          "[SIGNAL] WebSocket not open"
        );

        return false;

      }


      const message = {

        type:
          "SIGNAL",

        team:
          team,

        data:
          data

      };


      console.log(
        "[SIGNAL] Sending:",
        message
      );


      signalingWs.send(
        JSON.stringify(
          message
        )
      );


      return true;

    }


    /* ============================================================
       CLOSE WEBRTC
       ============================================================ */

    function closePeer() {

      remoteDescriptionSet =
        false;


      pendingCandidates =
        [];


      if (channel) {

        try {

          channel.close();

        } catch (e) {}

      }


      channel =
        null;


      if (peer) {

        try {

          peer.close();

        } catch (e) {}

      }


      peer =
        null;

    }


    /* ============================================================
       CREATE PHONE PEER
       ============================================================ */

    function createPhonePeer() {

      console.log(
        "[WEBRTC] Creating phone peer"
      );


      closePeer();


      peer =
        new RTCPeerConnection(
          RTC_CONFIG
        );


      /* ----------------------------------------------------------
         LAPTOP CREATED THE DATA CHANNEL.
         PHONE RECEIVES IT HERE.
         ---------------------------------------------------------- */

      peer.ondatachannel =
        function(event) {

          console.log(
            "[WEBRTC] DataChannel received"
          );


          channel =
            event.channel;


          channel.onopen =
            function() {

              console.log(
                "[WEBRTC] DataChannel OPEN"
              );


              connLbl.textContent =
                "WebRTC Connected";


              connLbl.style.color =
                "#22c55e";


              if (phoneArmed) {

                status.textContent =
                  "TAP NOW!";

              } else {

                status.textContent =
                  "Waiting for next question...";

              }

            };


          channel.onmessage =
            function(event) {

              handleGameMessage(
                event.data
              );

            };


          channel.onclose =
            function() {

              console.log(
                "[WEBRTC] DataChannel CLOSED"
              );


              channel =
                null;


              if (!phoneArmed) {

                connLbl.textContent =
                  "WebRTC Disconnected";


                connLbl.style.color =
                  "#ef4444";


                status.textContent =
                  "Reconnecting...";

              }

            };


          channel.onerror =
            function(error) {

              console.error(
                "[WEBRTC] DataChannel error:",
                error
              );

            };

        };


      /* ----------------------------------------------------------
         ICE CANDIDATES
         ---------------------------------------------------------- */

      peer.onicecandidate =
        function(event) {

          if (
            !event.candidate
          ) {

            return;

          }


          sendSignal({

            type:
              "candidate",

            candidate:
              event.candidate

          });

        };


      /* ----------------------------------------------------------
         CONNECTION STATE
         ---------------------------------------------------------- */

      peer.onconnectionstatechange =
        function() {

          console.log(
            "[WEBRTC] Connection state:",
            peer.connectionState
          );


          if (
            peer.connectionState ===
            "connected"
          ) {

            connLbl.textContent =
              "WebRTC Connected";


            connLbl.style.color =
              "#22c55e";


            status.textContent =
              phoneArmed
                ? "TAP NOW!"
                : "Waiting for next question...";

          }


          if (
            peer.connectionState ===
              "failed" ||
            peer.connectionState ===
              "disconnected"
          ) {

            connLbl.textContent =
              "WebRTC Disconnected";


            connLbl.style.color =
              "#ef4444";


            if (!phoneArmed) {

              status.textContent =
                "Reconnecting...";

            }

          }

        };

    }


    /* ============================================================
       ADD ICE CANDIDATE
       ============================================================ */

    async function addRemoteCandidate(
      candidate
    ) {

      if (!peer) {

        return;

      }


      /*
       * ICE can arrive before the offer.
       * Queue it until remote description exists.
       */

      if (
        !remoteDescriptionSet
      ) {

        pendingCandidates.push(
          candidate
        );

        return;

      }


      try {

        await peer.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      } catch (error) {

        console.warn(
          "[WEBRTC] ICE candidate error:",
          error
        );

      }

    }


    /* ============================================================
       FLUSH ICE QUEUE
       ============================================================ */

    async function flushCandidateQueue() {

      if (
        !peer ||
        !remoteDescriptionSet
      ) {

        return;

      }


      for (
        const candidate
        of pendingCandidates
      ) {

        try {

          await peer.addIceCandidate(
            new RTCIceCandidate(
              candidate
            )
          );

        } catch (error) {

          console.warn(
            "[WEBRTC] Queued ICE failed:",
            error
          );

        }

      }


      pendingCandidates =
        [];

    }


    /* ============================================================
       HANDLE CLOUDFLARE SIGNAL
       ============================================================ */

    async function handleSignalMessage(
      msg
    ) {

      console.log(
        "[SIGNAL] Received:",
        msg
      );


      /*
       * We only process SIGNAL messages
       * belonging to our team.
       */

      if (
        msg.type ===
          "SIGNAL"
      ) {

        if (
          Number(msg.team) !==
          team
        ) {

          return;

        }


        if (!msg.data) {

          return;

        }


        const data =
          msg.data;


        if (!peer) {

          createPhonePeer();

        }


        /* --------------------------------------------------------
           OFFER FROM LAPTOP
           -------------------------------------------------------- */

        if (
          data.type ===
          "offer"
        ) {

          console.log(
            "[WEBRTC] Offer received"
          );


          await peer.setRemoteDescription(
            new RTCSessionDescription(
              data.offer
            )
          );


          remoteDescriptionSet =
            true;


          await flushCandidateQueue();


          /*
           * Create answer.
           */

          const answer =
            await peer.createAnswer();


          await peer.setLocalDescription(
            answer
          );


          console.log(
            "[WEBRTC] Sending answer"
          );


          sendSignal({

            type:
              "answer",

            answer:
              peer.localDescription

          });


          return;

        }


        /* --------------------------------------------------------
           ICE FROM LAPTOP
           -------------------------------------------------------- */

        if (
          data.type ===
            "candidate" &&
          data.candidate
        ) {

          await addRemoteCandidate(
            data.candidate
          );

          return;

        }

      }


      /*
       * Optional ROOM_STATE message.
       */

      if (
        msg.type ===
        "ROOM_STATE"
      ) {

        console.log(
          "[ROOM] State:",
          msg
        );

      }

    }


    /* ============================================================
       GAME MESSAGE FROM LAPTOP
       ============================================================ */

    function handleGameMessage(
      rawMessage
    ) {

      let msg;


      try {

        msg =
          JSON.parse(
            rawMessage
          );

      } catch (error) {

        console.warn(
          "[GAME] Invalid message:",
          rawMessage
        );

        return;

      }


      console.log(
        "[GAME] Received:",
        msg
      );


      /* ----------------------------------------------------------
         ARM
         ---------------------------------------------------------- */

      if (
        msg.type ===
        "ARM"
      ) {

        setArmed();

        return;

      }


      /* ----------------------------------------------------------
         LOCK
         ---------------------------------------------------------- */

      if (
        msg.type ===
        "LOCK"
      ) {

        setLocked(
          msg.winner?.team
        );

        return;

      }


      /* ----------------------------------------------------------
         RESET
         ---------------------------------------------------------- */

      if (
        msg.type ===
        "RESET"
      ) {

        setStandby(
          "Waiting for next question..."
        );

        return;

      }

    }


    /* ============================================================
       BUZZ
       ============================================================ */

    function buzz() {

      /*
       * Must be armed.
       */

      if (
        !phoneArmed
      ) {

        return;

      }


      /*
       * Prevent multiple taps.
       */

      if (
        phoneBuzzed
      ) {

        return;

      }


      /*
       * Must have direct WebRTC connection.
       */

      if (
        !channel ||
        channel.readyState !==
          "open"
      ) {

        console.warn(
          "[BUZZ] WebRTC channel not open"
        );

        return;

      }


      phoneBuzzed =
        true;


      phoneArmed =
        false;


      /*
       * IMPORTANT:
       *
       * This message does NOT go to Cloudflare.
       *
       * PHONE
       *   ↓
       * WebRTC DataChannel
       *   ↓
       * LAPTOP
       */

      const message = {

        type:
          "BUZZ",

        team:
          team,

        timestamp:
          Date.now()

      };


      console.log(
        "[BUZZ] Sending:",
        message
      );


      channel.send(
        JSON.stringify(
          message
        )
      );


      btn.disabled =
        true;


      btn.textContent =
        "BUZZED!";


      status.textContent =
        "Waiting for host...";

    }


    /* ============================================================
       BUTTON EVENTS
       ============================================================ */

    btn.addEventListener(
      "pointerdown",
      function(event) {

        event.preventDefault();

        buzz();

      },
      {
        passive: false
      }
    );


    btn.addEventListener(
      "touchstart",
      function(event) {

        event.preventDefault();

      },
      {
        passive: false
      }
    );


    /* ============================================================
       CONNECT TO CLOUDFLARE SIGNALING
       ============================================================ */

    function connectSignaling() {

      if (
        signalingWs &&
        (
          signalingWs.readyState ===
            WebSocket.OPEN ||
          signalingWs.readyState ===
            WebSocket.CONNECTING
        )
      ) {

        return;

      }


      clearTimeout(
        reconnectTimer
      );


      connLbl.textContent =
        "Connecting...";


      connLbl.style.color =
        "";


      status.textContent =
        "Connecting to host...";


      console.log(
        "[SIGNAL] Connecting to room:",
        room
      );


      signalingWs =
        new WebSocket(
          `wss://${SIGNALING_HOST}/?room=${encodeURIComponent(room)}`
        );


      /* ----------------------------------------------------------
         CONNECTED TO CLOUDFLARE
         ---------------------------------------------------------- */

      signalingWs.onopen =
        function() {

          console.log(
            "[SIGNAL] Connected to Cloudflare"
          );


          retryDelay =
            1000;


          connLbl.textContent =
            "Signaling Connected";


          connLbl.style.color =
            "#22c55e";


          status.textContent =
            "Connecting buzzer...";


          /*
           * Tell Worker:
           *
           * "This phone is Team 1/Team 2."
           */

          signalingWs.send(
            JSON.stringify({

              type:
                "REGISTER_PHONE",

              team:
                team,

              name:
                name

            })
          );


          console.log(
            "[SIGNAL] Registered Team",
            team + 1
          );


          /*
           * Prepare WebRTC before offer arrives.
           */

          createPhonePeer();

        };


      /* ----------------------------------------------------------
         SIGNALING MESSAGE
         ---------------------------------------------------------- */

      signalingWs.onmessage =
        async function(event) {

          try {

            const msg =
              JSON.parse(
                event.data
              );


            await handleSignalMessage(
              msg
            );

          } catch (error) {

            console.error(
              "[SIGNAL] Message error:",
              error
            );

          }

        };


      /* ----------------------------------------------------------
         ERROR
         ---------------------------------------------------------- */

      signalingWs.onerror =
        function(error) {

          console.error(
            "[SIGNAL] WebSocket error:",
            error
          );


          connLbl.textContent =
            "Signaling Error";


          connLbl.style.color =
            "#ef4444";

        };


      /* ----------------------------------------------------------
         CLOSED
         ---------------------------------------------------------- */

      signalingWs.onclose =
        function() {

          console.log(
            "[SIGNAL] Disconnected"
          );


          closePeer();


          connLbl.textContent =
            "Offline";


          connLbl.style.color =
            "#ef4444";


          if (!phoneArmed) {

            status.textContent =
              "Reconnecting...";

          }


          clearTimeout(
            reconnectTimer
          );


          reconnectTimer =
            setTimeout(
              connectSignaling,
              retryDelay
            );


          retryDelay =
            Math.min(
              retryDelay * 2,
              MAX_RETRY_DELAY
            );

        };

    }


    /* ============================================================
       PAGE / NETWORK RECOVERY
       ============================================================ */

    window.addEventListener(
      "online",
      function() {

        connectSignaling();

      }
    );


    window.addEventListener(
      "pageshow",
      function() {

        connectSignaling();

      }
    );


    document.addEventListener(
      "visibilitychange",
      function() {

        if (
          document.visibilityState ===
          "visible"
        ) {

          connectSignaling();


          if (
            "wakeLock" in
            navigator
          ) {

            navigator.wakeLock
              .request(
                "screen"
              )
              .catch(
                () => {}
              );

          }

        }

      }
    );


    /* ============================================================
       KEEP SCREEN AWAKE
       ============================================================ */

    async function keepScreenAwake() {

      if (
        "wakeLock" in
        navigator
      ) {

        try {

          await navigator.wakeLock
            .request(
              "screen"
            );

        } catch (error) {

          console.log(
            "[WAKELOCK] Not available"
          );

        }

      }

    }


    /* ============================================================
       INITIAL STATE
       ============================================================ */

    setStandby(
      "Connecting to host..."
    );


    keepScreenAwake();


    connectSignaling();

  </script>

</body>
</html>
