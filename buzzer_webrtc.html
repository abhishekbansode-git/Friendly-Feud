<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1" />
  <title>Buzzer</title>
  <style>
    * { box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    body { margin:0; height:100dvh; display:flex; flex-direction:column; padding:20px; background:radial-gradient(ellipse at top, #0f4c81 0%, #031533 60%, #010a1a 100%); color:#fff; font-family:sans-serif; }
    .header { display:flex; justify-content:space-between; font-size:14px; opacity:0.8; font-family: monospace; color: #ffeb85; }
    #team-title { font-size:40px; font-weight:900; text-align:center; margin:15px 0 5px 0; text-shadow: 0 4px 10px rgba(0,0,0,0.8); text-transform: uppercase; letter-spacing: 2px; }
    #status-text { text-align:center; font-size:18px; margin-bottom:20px; color: #ffeb85; text-shadow: 0 2px 4px rgba(0,0,0,0.8); opacity: 0.9; }
    
    .wood-board {
      flex: 1;
      margin: 10px 0;
      border: 6px solid #ffd700;
      border-radius: 30px;
      background: #5c3a21;
      background-image: 
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 15px,
          rgba(0,0,0,0.1) 15px,
          rgba(0,0,0,0.1) 30px
        ),
        linear-gradient(180deg, #6b4324, #2a170a);
      box-shadow: 
        0 0 30px rgba(255, 215, 0, 0.5),
        inset 0 0 40px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .buzzer-container {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(255, 215, 0, 0.1) 0%, transparent 60%);
      width: 100%;
      height: 100%;
    }

    .podium {
      --size: min(80vw, 55vh, 300px);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: linear-gradient(135deg, #0d47a1, #0a1f44); /* Blue base */
      box-shadow: 
        0 30px 60px -15px rgba(0,0,0,1),
        inset 0 4px 8px rgba(255,255,255,0.3),
        inset 0 -5px 15px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #06193b;
      position: relative;
    }

    .podium::after {
      content: '';
      position: absolute;
      width: calc(var(--size) - 20px);
      height: calc(var(--size) - 20px);
      border-radius: 50%;
      background: linear-gradient(to bottom, #1565c0, #0a2656); /* Top of blue base */
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
      z-index: 1;
    }

    #buzz-btn {
      width: calc(var(--size) - 60px);
      height: calc(var(--size) - 60px);
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.5);
      font-size: 32px;
      font-weight: 900;
      color: rgba(255,255,255,0.5);
      /* Dark unlit red */
      background: radial-gradient(circle at 35% 35%, #b71c1c, #4a0404);
      box-shadow: 
        0 20px 30px rgba(0,0,0,0.9),
        inset 0 -15px 25px rgba(0,0,0,0.7),
        inset 0 10px 20px rgba(255,255,255,0.2);
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      text-shadow: 0 -1px 2px rgba(0,0,0,0.8);
      position: relative;
      top: -10px;
      z-index: 2;
      outline: none;
    }

    #buzz-btn.countdown { 
      opacity: 0.9; 
      background: radial-gradient(circle at 35% 35%, #fde047, #ca8a04); 
      color: #000; 
      font-size: 48px; 
      box-shadow: 
        0 15px 25px rgba(0,0,0,0.6),
        0 0 50px #eab308,
        inset 0 -15px 25px rgba(0,0,0,0.4),
        inset 0 15px 25px rgba(255,255,255,0.5);
    }

    #buzz-btn.armed {
      color: #fff;
      /* Bright glowing red */
      background: radial-gradient(circle at 35% 35%, #ff4d4d, #d32f2f);
      box-shadow: 
        0 15px 25px rgba(0,0,0,0.6),
        0 0 50px #ff0000,
        inset 0 -15px 25px rgba(0,0,0,0.4),
        inset 0 15px 25px rgba(255,255,255,0.6);
      top: -10px;
      cursor: pointer;
    }

    #buzz-btn.armed:active {
      top: 0px;
      box-shadow: 
        0 5px 10px rgba(0,0,0,0.8),
        0 0 60px #ff0000,
        inset 0 -5px 15px rgba(0,0,0,0.6),
        inset 0 5px 15px rgba(255,255,255,0.5);
    }

    #buzz-btn.winner {
      color: #fff;
      background: radial-gradient(circle at 35% 35%, #86efac, #22c55e) !important;
      box-shadow: 
        0 5px 10px rgba(0,0,0,0.8),
        0 0 100px #22c55e,
        inset 0 -5px 15px rgba(0,0,0,0.6),
        inset 0 5px 15px rgba(255,255,255,0.6) !important;
      top: 0px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>Room: <b id="room-lbl">-</b></span>
    <span id="conn-lbl">Connecting...</span>
  </div>

  <div id="team-title">TEAM</div>
  <div id="status-text">Connecting to host...</div>

  <div class="wood-board">
    <div class="buzzer-container">
      <div class="podium">
        <button id="buzz-btn" disabled>STANDBY</button>
      </div>
    </div>
  </div>

<script>
  
  // ============================================================
  // FRIENDLY FEUD PHONE - WebRTC buzzer client
  // Cloudflare is used ONLY for signaling.
  // ============================================================
  const BACKEND_HOST = "feud-backend.feud-buzz-app.workers.dev";
  const params = new URLSearchParams(window.location.search);

  let room = params.get("room");
  let team = params.get("team");
  let name = params.get("name");
  let color = params.get("color");

  if (room) {
    room = room.toUpperCase();
    localStorage.setItem("feud_room", room);
    if (team !== null) localStorage.setItem("feud_team", team);
    if (name) localStorage.setItem("feud_name", name);
    if (color) localStorage.setItem("feud_color", color);
  } else {
    room = (localStorage.getItem("feud_room") || "").toUpperCase();
    team = localStorage.getItem("feud_team") || "0";
    name = localStorage.getItem("feud_name") || `Team ${parseInt(team) + 1}`;
    color = localStorage.getItem("feud_color") || "#3b82f6";
  }

  if (!room || room.length !== 4) {
    document.getElementById("status-text").textContent =
      "Invalid or missing room code. Please scan QR again.";
    document.getElementById("conn-lbl").textContent = "No Room";
    throw new Error("Invalid room code");
  }

  document.documentElement.style.setProperty("--team-color", color);
  document.getElementById("room-lbl").textContent = room;
  document.getElementById("team-title").textContent = name;
  document.getElementById("team-title").style.color = color;

  const btn = document.getElementById("buzz-btn");
  const status = document.getElementById("status-text");
  const connLbl = document.getElementById("conn-lbl");

  let signalingWs = null;
  let pc = null;
  let channel = null;
  let reconnectTimer = null;

  function connectSignaling() {
    if (signalingWs &&
        (signalingWs.readyState === WebSocket.OPEN ||
         signalingWs.readyState === WebSocket.CONNECTING)) return;

    connLbl.textContent = "Connecting...";

    signalingWs = new WebSocket(
      `wss://${BACKEND_HOST}/?room=${encodeURIComponent(room)}` +
      `&role=player&team=${encodeURIComponent(team)}`
    );

    signalingWs.onopen = () => {
      signalingWs.send(JSON.stringify({
        type: "REGISTER_PLAYER",
        room,
        team,
        name
      }));
    };

    signalingWs.onmessage = async event => {
      try {
        const msg = JSON.parse(event.data);

        if (msg.type === "WEBRTC_OFFER" && msg.description) {
          await acceptOffer(msg.description);
        }

        if (msg.type === "WEBRTC_ICE" && msg.candidate && pc) {
          try { await pc.addIceCandidate(msg.candidate); } catch {}
        }
      } catch (e) {
        console.warn("Signaling message error", e);
      }
    };

    signalingWs.onclose = () => {
      connLbl.textContent = "Offline";
      status.textContent = "Reconnecting...";
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectSignaling, 2500);
    };
  }

  async function waitForIceGathering() {
    if (!pc || pc.iceGatheringState === "complete") return;

    await new Promise(resolve => {
      const timer = setInterval(() => {
        if (!pc || pc.iceGatheringState === "complete") {
          clearInterval(timer);
          resolve();
        }
      }, 50);
      setTimeout(() => {
        clearInterval(timer);
        resolve();
      }, 8000);
    });
  }

  function installChannel(ch) {
    channel = ch;

    ch.onopen = () => {
      connLbl.textContent = "Online";
      status.textContent = "Connected. Waiting for host...";
    };

    ch.onclose = () => {
      connLbl.textContent = "Offline";
      status.textContent = "Connection lost. Reconnecting...";
    };

    ch.onerror = e => console.warn("WebRTC DataChannel error", e);

    ch.onmessage = event => {
      let data;
      try { data = JSON.parse(event.data); } catch { return; }

      if (data.type === "ARMED") {
        btn.disabled = false;
        btn.className = "armed";
        btn.textContent = "BUZZ!";
        status.textContent = "TAP NOW!";
        navigator.vibrate?.([80, 40, 80]);
      }

      if (data.type === "LOCKED") {
        btn.disabled = true;
        btn.classList.remove("armed", "countdown");

        if (String(data.winner?.team) === String(team)) {
          btn.classList.add("winner");
          btn.textContent = "YOU BUZZED!";
          status.textContent = "You got in first! Answer now.";
          navigator.vibrate?.([100, 50, 100]);
        } else {
          btn.textContent = "LOCKED OUT";
          status.textContent = `${data.winner?.name || "Other team"} buzzed first!`;
        }
      }

      if (data.type === "RESET") {
        btn.disabled = true;
        btn.className = "";
        btn.textContent = "STANDBY";
        status.textContent = "Waiting for next question...";
      }
    };
  }

  async function acceptOffer(offer) {
    if (pc) {
      try { pc.close(); } catch {}
    }

    pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    pc.ondatachannel = event => installChannel(event.channel);

    pc.onicecandidate = event => {
      if (event.candidate && signalingWs?.readyState === WebSocket.OPEN) {
        signalingWs.send(JSON.stringify({
          type: "WEBRTC_ICE",
          room,
          team,
          candidate: event.candidate
        }));
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") {
        connLbl.textContent = "Online";
      }
    };

    await pc.setRemoteDescription(offer);

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitForIceGathering();

    // Only SDP signaling goes through Cloudflare.
    signalingWs.send(JSON.stringify({
      type: "WEBRTC_ANSWER",
      room,
      team,
      description: pc.localDescription
    }));
  }

  btn.addEventListener("pointerdown", e => {
    e.preventDefault();

    if (!btn.disabled && channel && channel.readyState === "open") {
      channel.send(JSON.stringify({
        type: "BUZZ",
        team: String(team),
        name,
        clientTime: performance.now()
      }));
    }
  });

  if ("wakeLock" in navigator) {
    navigator.wakeLock.request("screen").catch(() => {});
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && "wakeLock" in navigator) {
      navigator.wakeLock.request("screen").catch(() => {});
    }
  });

  window.addEventListener("pageshow", connectSignaling);
  window.addEventListener("online", connectSignaling);

  connectSignaling();

</script>
</body>
</html>
