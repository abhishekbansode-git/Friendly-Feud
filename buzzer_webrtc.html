<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1" />
  <title>Friendly Feud Buzzer</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      outline: none;
    }

    button:focus,
    button:active,
    #buzz-btn:focus,
    #buzz-btn:active {
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      background: radial-gradient(
        ellipse at top,
        #0f4c81 0%,
        #031533 60%,
        #010a1a 100%
      );
      color: #fff;
      font-family: sans-serif;
    }

    .header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      opacity: 0.8;
      font-family: monospace;
      color: #ffeb85;
    }

    #team-title {
      font-size: 40px;
      font-weight: 900;
      text-align: center;
      margin: 15px 0 5px 0;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #status-text {
      text-align: center;
      font-size: 18px;
      margin-bottom: 20px;
      color: #ffeb85;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      opacity: 0.9;
    }

    .wood-board {
      flex: 1;
      margin: 10px 0;
      border: 6px solid #ffd700;
      border-radius: 30px;
      background: #5c3a21;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 15px,
          rgba(0,0,0,0.1) 15px,
          rgba(0,0,0,0.1) 30px
        ),
        linear-gradient(180deg, #6b4324, #2a170a);
      box-shadow:
        0 0 30px rgba(255, 215, 0, 0.5),
        inset 0 0 40px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .wood-board.buzzed {
      border-color: #22c55e !important;
      box-shadow:
        0 0 40px rgba(34, 197, 94, 0.8),
        0 0 80px rgba(34, 197, 94, 0.4),
        inset 0 0 40px rgba(0,0,0,0.8) !important;
    }

    .buzzer-container {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(
        circle at center,
        rgba(255, 215, 0, 0.1) 0%,
        transparent 60%
      );
      width: 100%;
      height: 100%;
    }

    .podium {
      --size: min(80vw, 55vh, 300px);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: linear-gradient(135deg, #0d47a1, #0a1f44);
      box-shadow:
        0 30px 60px -15px rgba(0,0,0,1),
        inset 0 4px 8px rgba(255,255,255,0.3),
        inset 0 -5px 15px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #06193b;
      position: relative;
    }

    .podium::after {
      content: '';
      position: absolute;
      width: calc(var(--size) - 20px);
      height: calc(var(--size) - 20px);
      border-radius: 50%;
      background: linear-gradient(to bottom, #1565c0, #0a2656);
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
      z-index: 1;
    }

    #buzz-btn {
      width: calc(var(--size) - 60px);
      height: calc(var(--size) - 60px);
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.5);
      font-size: 32px;
      font-weight: 900;
      color: rgba(255,255,255,0.5);
      background: radial-gradient(
        circle at 35% 35%,
        #b71c1c,
        #4a0404
      );
      box-shadow:
        0 20px 30px rgba(0,0,0,0.9),
        inset 0 -15px 25px rgba(0,0,0,0.7),
        inset 0 10px 20px rgba(255,255,255,0.2);
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      text-shadow: 0 -1px 2px rgba(0,0,0,0.8);
      position: relative;
      top: -10px;
      z-index: 2;
      outline: none;
    }

    #buzz-btn.countdown {
      opacity: 0.9;
      background: radial-gradient(
        circle at 35% 35%,
        #fde047,
        #ca8a04
      );
      color: #000;
      font-size: 48px;
      box-shadow:
        0 15px 25px rgba(0,0,0,0.6),
        0 0 50px #eab308,
        inset 0 -15px 25px rgba(0,0,0,0.4),
        inset 0 15px 25px rgba(255,255,255,0.5);
    }

    #buzz-btn.armed {
      color: #fff;
      background: radial-gradient(
        circle at 35% 35%,
        #ff4d4d,
        #d32f2f
      );
      box-shadow:
        0 15px 25px rgba(0,0,0,0.6),
        0 0 50px #ff0000,
        inset 0 -15px 25px rgba(0,0,0,0.4),
        inset 0 15px 25px rgba(255,255,255,0.6);
      top: -10px;
      cursor: pointer;
    }

    #buzz-btn.armed:active {
      top: 0px;
      box-shadow:
        0 5px 10px rgba(0,0,0,0.8),
        0 0 60px #ff0000,
        inset 0 -5px 15px rgba(0,0,0,0.6),
        inset 0 5px 15px rgba(255,255,255,0.5);
    }

    #buzz-btn.winner {
      color: #fff;
      background: radial-gradient(
        circle at 35% 35%,
        #86efac,
        #22c55e
      ) !important;
      box-shadow:
        0 5px 10px rgba(0,0,0,0.8),
        0 0 100px #22c55e,
        inset 0 -5px 15px rgba(0,0,0,0.6),
        inset 0 5px 15px rgba(255,255,255,0.6) !important;
      top: 0px;
    }
  </style>
</head>

<body>

  <div class="header">
    <span>
      <b>FRIENDLY FEUD BUZZER</b>
    </span>

    <span id="conn-lbl">
      Connecting...
    </span>
  </div>

  <div id="team-title">
    TEAM
  </div>

  <div id="status-text">
    Connecting to host...
  </div>

  <div class="wood-board" id="wood-board">
    <div class="buzzer-container">
      <div class="podium">
        <button id="buzz-btn" disabled>
          STANDBY
        </button>
      </div>
    </div>
  </div>


<script>

  // ============================================================
  // CONFIGURATION
  // ============================================================

  const SIGNALING_HOST =
    "friendly-feud-signaling.friendlyfeud.workers.dev";


  // ============================================================
  // URL / LOCAL STORAGE
  // ============================================================

  const params =
    new URLSearchParams(window.location.search);

  let room = params.get("room");
  let team = params.get("team");
  let name = params.get("name");
  let color = params.get("color");


  if (room) {

    room = room.toUpperCase();

    localStorage.setItem(
      "feud_room",
      room
    );

    if (team !== null) {
      localStorage.setItem(
        "feud_team",
        team
      );
    }

    if (name) {
      localStorage.setItem(
        "feud_name",
        name
      );
    }

    if (color) {
      localStorage.setItem(
        "feud_color",
        color
      );
    }

  } else {

    room =
      (
        localStorage.getItem("feud_room") ||
        ""
      ).toUpperCase();

    team =
      localStorage.getItem("feud_team") ||
      "0";

    name =
      localStorage.getItem("feud_name") ||
      "Team " +
      (parseInt(team, 10) + 1);

    color =
      localStorage.getItem("feud_color") ||
      "#3b82f6";
  }


  team = Number(team);


  // ============================================================
  // VALIDATION
  // ============================================================

  if (
    !room ||
    room.length !== 4 ||
    (team !== 0 && team !== 1)
  ) {

    document.getElementById(
      "status-text"
    ).textContent =
      "Invalid room or team. Please scan QR again.";

    document.getElementById(
      "conn-lbl"
    ).textContent =
      "Invalid";

    throw new Error(
      "Invalid room/team"
    );
  }


  // ============================================================
  // UI REFERENCES
  // ============================================================

  document.documentElement.style.setProperty(
    "--team-color",
    color
  );

  const roomLbl = document.getElementById("room-lbl");
  if (roomLbl) {
    roomLbl.textContent = room;
  }

  document.getElementById(
    "team-title"
  ).textContent =
    name;

  document.getElementById(
    "team-title"
  ).style.color =
    color;


  const btn =
    document.getElementById(
      "buzz-btn"
    );

  const status =
    document.getElementById(
      "status-text"
    );

  const connLbl =
    document.getElementById(
      "conn-lbl"
    );

  const woodBoard =
    document.getElementById(
      "wood-board"
    );

  let buzzerAudio = null;

  try {
    buzzerAudio = new Audio("data:audio/mp3;base64," + BUZZER_SOUND_B64);
    buzzerAudio.preload = "auto";
  } catch (e) {
    console.warn("Failed to initialize Audio:", e);

  function playBuzzerSound() {
    if (!buzzerAudio) {
      return;
    }

    try {
      buzzerAudio.currentTime = 0;
      const playPromise = buzzerAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn("Buzzer sound playback failed:", err);
        });
      }
    } catch (e) {
      console.warn("Error playing buzzer sound:", e);
    }
  }

  // Pre-unlock audio on mobile touch gestures
  function unlockAudio() {
    if (buzzerAudio) {
      buzzerAudio.load();
    }
  }

  window.addEventListener("touchstart", unlockAudio, { once: true });
  window.addEventListener("pointerdown", unlockAudio, { once: true });

  window.playBuzzerSound = playBuzzerSound;



  // ============================================================
  // SIGNALING / WEBRTC STATE
  // ============================================================

  let signalingWs = null;

  let peer = null;

  let channel = null;

  let candidateQueue = [];

  let remoteDescriptionSet = false;


  /*
   * IMPORTANT FIX
   *
   * Only one peer creation operation may happen at a time.
   */
  let peerCreationPromise = null;


  /*
   * Every peer gets a generation number.
   *
   * Events belonging to an old peer are ignored after
   * that peer has been replaced or closed.
   */
  let peerGeneration = 0;


  // ============================================================
  // SIGNALING RECONNECT STATE
  // ============================================================

  let reconnectTimer = null;

  let retryDelay = 1000;

  const MAX_RETRY_DELAY = 15000;


  // ============================================================
  // GAME STATE
  // ============================================================

  let phoneArmed = false;

  let phoneBuzzed = false;


  /*
   * Prevent a phone rejected by the server from repeatedly
   * reconnecting.
   */
  let teamRejected = false;


  // ============================================================
  // UI FUNCTIONS
  // ============================================================

  function setStandby(
    text = "Waiting for host..."
  ) {

    phoneArmed = false;

    phoneBuzzed = false;

    btn.disabled = true;

    btn.className = "";

    btn.textContent = "STANDBY";

    status.textContent = text;

    if (woodBoard) {
      woodBoard.classList.remove("buzzed");
    }
  }


  function setArmed() {

    if (teamRejected) {
      return;
    }

    phoneArmed = true;

    phoneBuzzed = false;

    btn.disabled = false;

    btn.className = "armed";

    btn.textContent = "BUZZ!";

    status.textContent = "TAP NOW!";

    if (woodBoard) {
      woodBoard.classList.remove("buzzed");
    }

    navigator.vibrate?.([
      80,
      40,
      80
    ]);
  }


  function setLocked(winnerTeam) {

    phoneArmed = false;

    btn.disabled = true;

    btn.classList.remove(
      "armed",
      "countdown"
    );


    if (
      Number(winnerTeam) === team
    ) {

      btn.classList.add(
        "winner"
      );

      if (woodBoard) {
        woodBoard.classList.add("buzzed");
      }

      btn.textContent =
        "YOU BUZZED!";

      status.textContent =
        "You got in first! Answer now.";

      navigator.vibrate?.([
        100,
        50,
        100
      ]);

    } else {

      btn.classList.remove(
        "winner"
      );

      if (woodBoard) {
        woodBoard.classList.remove("buzzed");
      }

      btn.textContent =
        "LOCKED OUT";

      status.textContent =
        "Other team buzzed first!";
    }
  }


  // ============================================================
  // SIGNALING SEND
  // ============================================================

  function sendSignal(data) {

    if (
      !signalingWs ||
      signalingWs.readyState !==
        WebSocket.OPEN
    ) {
      return false;
    }


    try {

      signalingWs.send(
        JSON.stringify({
          type: "SIGNAL",
          team,
          data
        })
      );

      return true;

    } catch (error) {

      console.error(
        "Failed to send signaling message:",
        error
      );

      return false;
    }
  }


  // ============================================================
  // CLOSE WEBRTC PEER
  // ============================================================

  function closePeer() {

    /*
     * Increment generation FIRST.
     *
     * This immediately makes all events from the old peer
     * stale.
     */
    peerGeneration++;


    candidateQueue = [];

    remoteDescriptionSet = false;


    if (channel) {

      try {
        channel.close();
      } catch (e) {}

    }

    channel = null;


    if (peer) {

      try {
        peer.close();
      } catch (e) {}

    }

    peer = null;
  }


  // ============================================================
  // CREATE PHONE WEBRTC PEER
  // ============================================================

  async function createPhonePeer() {

    /*
     * Close any existing peer before creating the new one.
     */
    closePeer();


    const myGeneration =
      peerGeneration;


    console.log(
      "Creating phone WebRTC peer, generation:",
      myGeneration
    );


    status.textContent =
      "Getting connection credentials...";


    // ----------------------------------------------------------
    // GET CLOUDFLARE TURN CREDENTIALS
    // ----------------------------------------------------------

    let turnResponse;


    try {

      turnResponse =
        await fetch(
          `https://${SIGNALING_HOST}/turn-credentials`,
          {
            method: "GET",
            cache: "no-store"
          }
        );

    } catch (error) {

      console.error(
        "TURN credential network error:",
        error
      );

      throw new Error(
        "Could not reach TURN credential server"
      );
    }


    /*
     * Peer may have been replaced while TURN credentials
     * were being fetched.
     */
    if (
      myGeneration !==
      peerGeneration
    ) {

      console.warn(
        "Ignoring stale TURN credential response."
      );

      return null;
    }


    if (!turnResponse.ok) {

      throw new Error(
        `TURN credentials failed: ${turnResponse.status}`
      );
    }


    const turnData =
      await turnResponse.json();


    if (
      !turnData ||
      !Array.isArray(
        turnData.iceServers
      ) ||
      turnData.iceServers.length === 0
    ) {

      throw new Error(
        "TURN server returned no iceServers"
      );
    }


    console.log(
      "TURN credentials received:",
      {
        iceServerCount:
          turnData.iceServers.length
      }
    );


    // ----------------------------------------------------------
    // CREATE RTCPeerConnection
    // ----------------------------------------------------------

    const pc =
      new RTCPeerConnection({
        iceServers:
          turnData.iceServers
      });


    /*
     * Make sure this peer is still current.
     */
    if (
      myGeneration !==
      peerGeneration
    ) {

      try {
        pc.close();
      } catch (e) {}

      return null;
    }


    peer = pc;


    // ==========================================================
    // ICE CANDIDATE
    // ==========================================================

    pc.onicecandidate =
      (event) => {

        if (
          myGeneration !==
          peerGeneration
        ) {
          return;
        }


        if (event.candidate) {

          sendSignal({
            type: "candidate",
            candidate:
              event.candidate
          });
        }
      };


    // ==========================================================
    // ICE CONNECTION STATE
    // ==========================================================

    pc.oniceconnectionstatechange =
      () => {

        if (
          myGeneration !==
          peerGeneration
        ) {
          return;
        }


        console.log(
          "Phone ICE state:",
          pc.iceConnectionState
        );
      };


    // ==========================================================
    // ICE GATHERING STATE
    // ==========================================================

    pc.onicegatheringstatechange =
      () => {

        if (
          myGeneration !==
          peerGeneration
        ) {
          return;
        }


        console.log(
          "Phone ICE gathering:",
          pc.iceGatheringState
        );
      };


    // ==========================================================
    // ICE CANDIDATE ERROR
    // ==========================================================

    pc.onicecandidateerror =
      (event) => {

        if (
          myGeneration !==
          peerGeneration
        ) {
          return;
        }


        console.error(
          "Phone ICE candidate ERROR:",
          {
            errorCode:
              event.errorCode,

            url:
              event.url,

            errorText:
              event.errorText
          }
        );
      };


    // ==========================================================
    // WEBRTC CONNECTION STATE
    // ==========================================================

    pc.onconnectionstatechange =
      () => {

        if (
          myGeneration !==
          peerGeneration
        ) {
          return;
        }


        console.log(
          "Phone WebRTC state:",
          pc.connectionState
        );


        if (
          pc.connectionState ===
          "connected"
        ) {

          connLbl.textContent =
            "Connected";

          connLbl.style.color =
            "#22c55e";


          status.textContent =
            phoneArmed
              ? "TAP NOW!"
              : "Waiting for next question...";
        }


        else if (
          [
            "failed",
            "disconnected",
            "closed"
          ].includes(
            pc.connectionState
          )
        ) {

          connLbl.textContent =
            "Disconnected";

          connLbl.style.color =
            "#ef4444";


          if (!phoneArmed) {

            status.textContent =
              "Reconnecting...";
          }
        }
      };


    // ==========================================================
    // INCOMING DATA CHANNEL
    // ==========================================================

    pc.ondatachannel =
      (event) => {

        if (
          myGeneration !==
          peerGeneration
        ) {

          try {
            event.channel.close();
          } catch (e) {}

          return;
        }


        /*
         * Close an unexpected duplicate channel.
         */
        if (
          channel &&
          channel !== event.channel
        ) {

          try {
            channel.close();
          } catch (e) {}
        }


        channel =
          event.channel;


        console.log(
          "Phone DataChannel received:",
          channel.label
        );


        // ------------------------------------------------------
        // CHANNEL OPEN
        // ------------------------------------------------------

        channel.onopen =
          () => {

            if (
              myGeneration !==
              peerGeneration
            ) {
              return;
            }


            console.log(
              "Phone DataChannel OPEN"
            );


            connLbl.textContent =
              "Connected";

            connLbl.style.color =
              "#22c55e";


            status.textContent =
              phoneArmed
                ? "TAP NOW!"
                : "Waiting for next question...";
          };


        // ------------------------------------------------------
        // CHANNEL MESSAGE
        // ------------------------------------------------------

        channel.onmessage =
          (event) => {

            if (
              myGeneration !==
              peerGeneration
            ) {
              return;
            }


            handleGameMessage(
              event.data
            );
          };


        // ------------------------------------------------------
        // CHANNEL CLOSE
        // ------------------------------------------------------

        channel.onclose =
          () => {

            if (
              myGeneration !==
              peerGeneration
            ) {
              return;
            }


            console.log(
              "Phone DataChannel CLOSED"
            );


            if (
              channel ===
              event.channel
            ) {

              channel = null;
            }


            connLbl.textContent =
              "Disconnected";

            connLbl.style.color =
              "#ef4444";


            if (!phoneArmed) {

              status.textContent =
                "Reconnecting...";
            }
          };


        // ------------------------------------------------------
        // CHANNEL ERROR
        // ------------------------------------------------------

        channel.onerror =
          (error) => {

            if (
              myGeneration !==
              peerGeneration
            ) {
              return;
            }


            console.error(
              "Phone DataChannel error:",
              error
            );
          };
      };


    console.log(
      "Phone WebRTC peer created:",
      myGeneration
    );


    return pc;
  }


  // ============================================================
  // ENSURE PHONE PEER
  // ============================================================

  /*
   * This is the main race-condition fix.
   *
   * If several signaling messages arrive while the peer is
   * being created, they all wait for the SAME promise.
   */

  async function ensurePhonePeer() {

    if (peer) {
      return peer;
    }


    if (peerCreationPromise) {

      await peerCreationPromise;

      return peer;
    }


    peerCreationPromise =
      createPhonePeer();


    try {

      await peerCreationPromise;

      return peer;

    } finally {

      peerCreationPromise = null;
    }
  }


  // ============================================================
  // FLUSH QUEUED ICE CANDIDATES
  // ============================================================

  async function flushCandidateQueue() {

    if (
      !peer ||
      !remoteDescriptionSet
    ) {
      return;
    }


    const pc =
      peer;

    const queued =
      candidateQueue.slice();


    candidateQueue = [];


    for (
      const candidate of queued
    ) {

      /*
       * Do not add candidates to a replacement peer.
       */
      if (
        pc !== peer
      ) {

        console.warn(
          "Peer changed while flushing ICE candidates."
        );

        return;
      }


      try {

        await pc.addIceCandidate(
          candidate
        );

      } catch (error) {

        console.warn(
          "Queued ICE candidate failed:",
          error
        );
      }
    }
  }


  // ============================================================
  // HANDLE SIGNALING MESSAGE
  // ============================================================

  async function handleSignalMessage(msg) {

    if (
      msg.type !== "SIGNAL" ||
      !msg.data
    ) {
      return;
    }


    const data =
      msg.data;


    /*
     * CRITICAL FIX:
     *
     * The old code did:
     *
     *     if (!peer) createPhonePeer();
     *
     * and then immediately tried to use peer.
     *
     * createPhonePeer() is async because it fetches TURN
     * credentials.
     *
     * We now WAIT until the peer actually exists.
     */

    const pc =
      await ensurePhonePeer();


    if (!pc) {

      console.warn(
        "No active peer available for signaling message."
      );

      return;
    }


    // ==========================================================
    // OFFER
    // ==========================================================

    if (
      data.type === "offer" &&
      data.offer
    ) {

      try {

        /*
         * Ignore an offer for an old peer.
         */
        if (
          pc !== peer
        ) {

          console.warn(
            "Ignoring offer for stale peer."
          );

          return;
        }


        console.log(
          "Phone received WebRTC OFFER"
        );


        await pc.setRemoteDescription(
          data.offer
        );


        if (
          pc !== peer
        ) {

          console.warn(
            "Peer changed while setting remote description."
          );

          return;
        }


        remoteDescriptionSet = true;


        await flushCandidateQueue();


        if (
          pc !== peer
        ) {

          console.warn(
            "Peer changed before creating answer."
          );

          return;
        }


        const answer =
          await pc.createAnswer();


        if (
          pc !== peer
        ) {

          console.warn(
            "Peer changed before setting local description."
          );

          return;
        }


        await pc.setLocalDescription(
          answer
        );


        if (
          pc !== peer
        ) {

          console.warn(
            "Peer changed before sending answer."
          );

          return;
        }


        sendSignal({
          type: "answer",
          answer:
            pc.localDescription
        });


        console.log(
          "Phone sent WebRTC ANSWER"
        );


      } catch (error) {

        console.error(
          "WebRTC offer/answer error:",
          error
        );
      }


      return;
    }


    // ==========================================================
    // REMOTE ICE CANDIDATE
    // ==========================================================

    if (
      data.type === "candidate" &&
      data.candidate
    ) {

      /*
       * If remote description isn't ready yet,
       * hold the candidate.
       */

      if (
        !remoteDescriptionSet
      ) {

        candidateQueue.push(
          data.candidate
        );


        console.log(
          "Queued remote ICE candidate. Queue size:",
          candidateQueue.length
        );


        return;
      }


      /*
       * Do not feed candidates into an old peer.
       */

      if (
        pc !== peer
      ) {

        console.warn(
          "Ignoring ICE candidate for stale peer."
        );

        return;
      }


      try {

        await pc.addIceCandidate(
          data.candidate
        );

      } catch (error) {

        console.warn(
          "ICE candidate failed:",
          error
        );
      }
    }
  }


  // ============================================================
  // GAME DATA CHANNEL
  // ============================================================

  function handleGameMessage(raw) {

    let msg;


    try {

      msg =
        JSON.parse(raw);

    } catch (e) {

      console.warn(
        "Invalid game message:",
        raw
      );

      return;
    }


    // ----------------------------------------------------------
    // ARM
    // ----------------------------------------------------------

    if (
      msg.type === "ARM"
    ) {

      setArmed();

      return;
    }


    // ----------------------------------------------------------
    // LOCK
    // ----------------------------------------------------------

    if (
      msg.type === "LOCK"
    ) {

      setLocked(
        msg.winnerTeam
      );

      return;
    }


    // ----------------------------------------------------------
    // RESET
    // ----------------------------------------------------------

    if (
      msg.type === "RESET"
    ) {

      setStandby(
        "Waiting for next question..."
      );

      return;
    }
  }


  // ============================================================
  // BUZZ
  // ============================================================

  function buzz() {

    if (teamRejected) {
      return;
    }


    if (
      !phoneArmed ||
      phoneBuzzed
    ) {
      return;
    }


    if (
      !channel ||
      channel.readyState !==
        "open"
    ) {

      console.warn(
        "BUZZ ignored: DataChannel not open."
      );

      return;
    }


    phoneBuzzed = true;

    phoneArmed = false;

    btn.disabled = true;

    if (woodBoard) {
      woodBoard.classList.add("buzzed");
    }

    playBuzzerSound();


    try {

      channel.send(
        JSON.stringify({
          type: "BUZZ",
          team,
          timestamp: Date.now()
        })
      );


      console.log(
        "BUZZ sent for Team",
        team + 1
      );


    } catch (error) {

      console.error(
        "Failed to send BUZZ:",
        error
      );


      /*
       * If send failed, don't leave the buzzer falsely
       * showing that the buzz was delivered.
       */

      phoneBuzzed = false;

      phoneArmed = true;

      btn.disabled = false;

      if (woodBoard) {
        woodBoard.classList.remove("buzzed");
      }
    }
  }


  // ============================================================
  // BUZZ BUTTON
  // ============================================================

  btn.addEventListener(
    "pointerdown",
    (event) => {

      event.preventDefault();

      buzz();
    }
  );


  // ============================================================
  // CONNECT SIGNALING
  // ============================================================

  function connectSignaling() {

    if (teamRejected) {
      return;
    }


    if (
      signalingWs &&
      (
        signalingWs.readyState ===
          WebSocket.OPEN ||
        signalingWs.readyState ===
          WebSocket.CONNECTING
      )
    ) {

      return;
    }


    clearTimeout(
      reconnectTimer
    );


    connLbl.textContent =
      "Connecting...";

    connLbl.style.color =
      "";


    /*
     * Create a local WebSocket variable so old sockets
     * cannot interfere with a newer connection.
     */

    const ws =
      new WebSocket(
        "wss://" +
        SIGNALING_HOST +
        "/?room=" +
        encodeURIComponent(room)
      );


    signalingWs = ws;


    // ==========================================================
    // SIGNALING OPEN
    // ==========================================================

    ws.onopen =
      () => {

        /*
         * Ignore an old WebSocket that has been replaced.
         */

        if (
          ws !== signalingWs
        ) {

          try {
            ws.close();
          } catch (e) {}

          return;
        }


        if (teamRejected) {

          try {
            ws.close();
          } catch (e) {}

          return;
        }


        retryDelay = 1000;


        connLbl.textContent =
          "Connecting...";

        connLbl.style.color =
          "#facc15";


        status.textContent =
          "Connecting buzzer...";


        ws.send(
          JSON.stringify({
            type: "REGISTER_PHONE",
            team,
            name
          })
        );


        /*
         * IMPORTANT:
         *
         * We intentionally do NOT call createPhonePeer()
         * here.
         *
         * The peer is created safely when the host's OFFER
         * arrives.
         */
      };


    // ==========================================================
    // SIGNALING MESSAGE
    // ==========================================================

    ws.onmessage =
      async (event) => {

        /*
         * Ignore messages from an old WebSocket.
         */

        if (
          ws !== signalingWs
        ) {

          return;
        }


        try {

          const msg =
            JSON.parse(
              event.data
            );


          // ----------------------------------------------------
          // TEAM OCCUPIED
          // ----------------------------------------------------

          if (
            msg.type ===
            "TEAM_OCCUPIED"
          ) {

            teamRejected = true;


            clearTimeout(
              reconnectTimer
            );


            closePeer();


            setStandby(
              "Team " +
              (team + 1) +
              " is already connected."
            );


            connLbl.textContent =
              "Team Occupied";

            connLbl.style.color =
              "#ef4444";


            try {
              ws.close();
            } catch (e) {}


            return;
          }


          // ----------------------------------------------------
          // NORMAL SIGNAL
          // ----------------------------------------------------

          await handleSignalMessage(
            msg
          );


        } catch (error) {

          console.error(
            "Signaling message error:",
            error
          );
        }
      };


    // ==========================================================
    // SIGNALING ERROR
    // ==========================================================

    ws.onerror =
      (error) => {

        if (
          ws !== signalingWs
        ) {
          return;
        }


        console.error(
          "Signaling error:",
          error
        );


        connLbl.textContent =
          "Disconnected";

        connLbl.style.color =
          "#ef4444";
      };


    // ==========================================================
    // SIGNALING CLOSE
    // ==========================================================

    ws.onclose =
      () => {

        /*
         * Ignore old WebSockets.
         */

        if (
          ws !== signalingWs
        ) {
          return;
        }


        signalingWs = null;


        /*
         * Close the current WebRTC peer.
         */

        closePeer();


        if (teamRejected) {

          connLbl.textContent =
            "Team Occupied";

          connLbl.style.color =
            "#ef4444";

          return;
        }


        connLbl.textContent =
          "Disconnected";

        connLbl.style.color =
          "#ef4444";


        if (!phoneArmed) {

          status.textContent =
            "Reconnecting in " +
            (
              retryDelay / 1000
            ).toFixed(0) +
            "s...";
        }


        clearTimeout(
          reconnectTimer
        );


        reconnectTimer =
          setTimeout(
            connectSignaling,
            retryDelay
          );


        retryDelay =
          Math.min(
            retryDelay * 2,
            MAX_RETRY_DELAY
          );
      };
  }


  // ============================================================
  // PAGE VISIBILITY
  // ============================================================

  document.addEventListener(
    "visibilitychange",
    () => {

      if (
        document.visibilityState ===
        "visible"
      ) {

        if (!teamRejected) {

          connectSignaling();
        }


        if (
          "wakeLock" in navigator
        ) {

          navigator.wakeLock
            .request("screen")
            .catch(() => {});
        }
      }
    }
  );


  // ============================================================
  // PAGE SHOW
  // ============================================================

  window.addEventListener(
    "pageshow",
    () => {

      if (!teamRejected) {

        connectSignaling();
      }
    }
  );


  // ============================================================
  // NETWORK ONLINE
  // ============================================================

  window.addEventListener(
    "online",
    () => {

      if (!teamRejected) {

        connectSignaling();
      }
    }
  );


  // ============================================================
  // WAKE LOCK
  // ============================================================

  if (
    "wakeLock" in navigator
  ) {

    navigator.wakeLock
      .request("screen")
      .catch(() => {});
  }


  // ============================================================
  // START
  // ============================================================

  setStandby();

  connectSignaling();

</script>

</body>
