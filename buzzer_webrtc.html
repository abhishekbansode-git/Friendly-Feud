<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1" />
  <title>Buzzer</title>
  <style>
    * { box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    body { margin:0; height:100dvh; display:flex; flex-direction:column; padding:20px; background:radial-gradient(ellipse at top, #0f4c81 0%, #031533 60%, #010a1a 100%); color:#fff; font-family:sans-serif; }
    .header { display:flex; justify-content:space-between; font-size:14px; opacity:0.8; font-family: monospace; color: #ffeb85; }
    #team-title { font-size:40px; font-weight:900; text-align:center; margin:15px 0 5px 0; text-shadow: 0 4px 10px rgba(0,0,0,0.8); text-transform: uppercase; letter-spacing: 2px; }
    #status-text { text-align:center; font-size:18px; margin-bottom:20px; color: #ffeb85; text-shadow: 0 2px 4px rgba(0,0,0,0.8); opacity: 0.9; }
    
    .wood-board {
      flex: 1;
      margin: 10px 0;
      border: 6px solid #ffd700;
      border-radius: 30px;
      background: #5c3a21;
      background-image: 
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 15px,
          rgba(0,0,0,0.1) 15px,
          rgba(0,0,0,0.1) 30px
        ),
        linear-gradient(180deg, #6b4324, #2a170a);
      box-shadow: 
        0 0 30px rgba(255, 215, 0, 0.5),
        inset 0 0 40px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .buzzer-container {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(255, 215, 0, 0.1) 0%, transparent 60%);
      width: 100%;
      height: 100%;
    }

    .podium {
      --size: min(80vw, 55vh, 300px);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: linear-gradient(135deg, #0d47a1, #0a1f44); /* Blue base */
      box-shadow: 
        0 30px 60px -15px rgba(0,0,0,1),
        inset 0 4px 8px rgba(255,255,255,0.3),
        inset 0 -5px 15px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #06193b;
      position: relative;
    }

    .podium::after {
      content: '';
      position: absolute;
      width: calc(var(--size) - 20px);
      height: calc(var(--size) - 20px);
      border-radius: 50%;
      background: linear-gradient(to bottom, #1565c0, #0a2656); /* Top of blue base */
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
      z-index: 1;
    }

    #buzz-btn {
      width: calc(var(--size) - 60px);
      height: calc(var(--size) - 60px);
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.5);
      font-size: 32px;
      font-weight: 900;
      color: rgba(255,255,255,0.5);
      /* Dark unlit red */
      background: radial-gradient(circle at 35% 35%, #b71c1c, #4a0404);
      box-shadow: 
        0 20px 30px rgba(0,0,0,0.9),
        inset 0 -15px 25px rgba(0,0,0,0.7),
        inset 0 10px 20px rgba(255,255,255,0.2);
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      text-shadow: 0 -1px 2px rgba(0,0,0,0.8);
      position: relative;
      top: -10px;
      z-index: 2;
      outline: none;
    }

    #buzz-btn.countdown { 
      opacity: 0.9; 
      background: radial-gradient(circle at 35% 35%, #fde047, #ca8a04); 
      color: #000; 
      font-size: 48px; 
      box-shadow: 
        0 15px 25px rgba(0,0,0,0.6),
        0 0 50px #eab308,
        inset 0 -15px 25px rgba(0,0,0,0.4),
        inset 0 15px 25px rgba(255,255,255,0.5);
    }

    #buzz-btn.armed {
      color: #fff;
      /* Bright glowing red */
      background: radial-gradient(circle at 35% 35%, #ff4d4d, #d32f2f);
      box-shadow: 
        0 15px 25px rgba(0,0,0,0.6),
        0 0 50px #ff0000,
        inset 0 -15px 25px rgba(0,0,0,0.4),
        inset 0 15px 25px rgba(255,255,255,0.6);
      top: -10px;
      cursor: pointer;
    }

    #buzz-btn.armed:active {
      top: 0px;
      box-shadow: 
        0 5px 10px rgba(0,0,0,0.8),
        0 0 60px #ff0000,
        inset 0 -5px 15px rgba(0,0,0,0.6),
        inset 0 5px 15px rgba(255,255,255,0.5);
    }

    #buzz-btn.winner {
      color: #fff;
      background: radial-gradient(circle at 35% 35%, #86efac, #22c55e) !important;
      box-shadow: 
        0 5px 10px rgba(0,0,0,0.8),
        0 0 100px #22c55e,
        inset 0 -5px 15px rgba(0,0,0,0.6),
        inset 0 5px 15px rgba(255,255,255,0.6) !important;
      top: 0px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>Room: <b id="room-lbl">-</b></span>
    <span id="conn-lbl">Connecting...</span>
  </div>

  <div id="team-title">TEAM</div>
  <div id="status-text">Connecting to host...</div>

  <div class="wood-board">
    <div class="buzzer-container">
      <div class="podium">
        <button id="buzz-btn" disabled>STANDBY</button>
      </div>
    </div>
  </div>

<script>

  /* ================================================================
     FRIENDLY FEUD TEST DIAGNOSTIC LOGGER - PHONE
     Local testing layer. Nothing is uploaded by this logger.
     Records signaling, WebRTC/ICE, DIRECT vs TURN/RELAY, game events,
     browser errors, network/visibility events and useful RTC stats.
     Downloads automatically when the host sends GAME_OVER.
     ================================================================ */
  const FF_DIAGNOSTIC = (() => {
    const entries = [];
    let sequence = 0;
    let downloaded = false;
    let statsTimer = null;
    let lastPath = null;

    const safeStringify = (value) => {
      try {
        if (value instanceof Error) {
          return `${value.name}: ${value.message}\n${value.stack || ""}`;
        }
        if (typeof value === "string") return value;
        return JSON.stringify(value, (key, val) => {
          if (val instanceof Error) {
            return { name: val.name, message: val.message, stack: val.stack };
          }
          return val;
        });
      } catch (_) {
        try { return String(value); } catch (__) { return "[Unserializable]"; }
      }
    };

    const safeGet = (fn, fallback = null) => {
      try { return fn(); } catch (_) { return fallback; }
    };

    const context = () => ({
      room: safeGet(() => room),
      team: safeGet(() => team + 1),
      online: navigator.onLine,
      visibility: document.visibilityState,
      userAgent: navigator.userAgent,
      screen: `${screen.width}x${screen.height}`,
      viewport: `${window.innerWidth}x${window.innerHeight}`,
      dpr: window.devicePixelRatio,
      connectionLabel: safeGet(() => connLbl.textContent),
      armed: safeGet(() => phoneArmed),
      buzzed: safeGet(() => phoneBuzzed),
      rejected: safeGet(() => teamRejected)
    });

    const add = (category, event, data = {}) => {
      const item = {
        seq: ++sequence,
        time: new Date().toISOString(),
        category,
        event,
        data,
        context: context()
      };
      entries.push(item);
      if (entries.length > 20000) entries.shift();
      return item;
    };

    const event = (eventName, data = {}) => add("EVENT", eventName, data);

    const originalConsole = {
      log: console.log.bind(console),
      info: console.info.bind(console),
      warn: console.warn.bind(console),
      error: console.error.bind(console)
    };

    ["log", "info", "warn", "error"].forEach((level) => {
      console[level] = (...args) => {
        add("CONSOLE", level.toUpperCase(), {
          args: args.map(safeStringify)
        });
        originalConsole[level](...args);
      };
    });

    window.addEventListener("error", (e) => {
      add("BROWSER_ERROR", "WINDOW_ERROR", {
        message: e.message,
        source: e.filename,
        line: e.lineno,
        column: e.colno,
        error: safeStringify(e.error)
      });
    });

    window.addEventListener("unhandledrejection", (e) => {
      add("BROWSER_ERROR", "UNHANDLED_REJECTION", {
        reason: safeStringify(e.reason)
      });
    });

    window.addEventListener("online", () => event("NETWORK_ONLINE"));
    window.addEventListener("offline", () => event("NETWORK_OFFLINE"));
    document.addEventListener("visibilitychange", () => {
      event("VISIBILITY_CHANGED", { state: document.visibilityState });
    });
    window.addEventListener("pageshow", () => event("PAGE_SHOW"));
    window.addEventListener("pagehide", () => event("PAGE_HIDE"));

    const getPathInfo = async () => {
      if (!peer) return null;

      try {
        const stats = await peer.getStats();
        let selectedPair = null;

        stats.forEach((report) => {
          if (report.type === "transport" && report.selectedCandidatePairId) {
            const pair = stats.get(report.selectedCandidatePairId);
            if (pair) selectedPair = pair;
          }
        });

        if (!selectedPair) {
          stats.forEach((report) => {
            if (
              report.type === "candidate-pair" &&
              report.state === "succeeded" &&
              (report.selected || report.nominated)
            ) {
              selectedPair = report;
            }
          });
        }

        if (!selectedPair) {
          stats.forEach((report) => {
            if (
              !selectedPair &&
              report.type === "candidate-pair" &&
              report.state === "succeeded"
            ) {
              selectedPair = report;
            }
          });
        }

        if (!selectedPair) {
          return {
            status: "NO_SELECTED_PAIR_YET",
            connectionState: peer.connectionState,
            iceConnectionState: peer.iceConnectionState,
            iceGatheringState: peer.iceGatheringState
          };
        }

        const local = stats.get(selectedPair.localCandidateId);
        const remote = stats.get(selectedPair.remoteCandidateId);
        const localType = local?.candidateType || "unknown";
        const remoteType = remote?.candidateType || "unknown";
        const isRelay = localType === "relay" || remoteType === "relay";

        return {
          status: "SELECTED",
          path: isRelay ? "TURN / RELAY" : "DIRECT",
          localCandidateType: localType,
          remoteCandidateType: remoteType,
          localProtocol: local?.protocol || null,
          remoteProtocol: remote?.protocol || null,
          relayProtocol: local?.relayProtocol || remote?.relayProtocol || null,
          localAddress: local?.address || local?.ip || null,
          remoteAddress: remote?.address || remote?.ip || null,
          bytesSent: selectedPair.bytesSent ?? null,
          bytesReceived: selectedPair.bytesReceived ?? null,
          packetsSent: selectedPair.packetsSent ?? null,
          packetsReceived: selectedPair.packetsReceived ?? null,
          packetsLost: selectedPair.packetsLost ?? null,
          currentRoundTripTime: selectedPair.currentRoundTripTime ?? null,
          availableOutgoingBitrate: selectedPair.availableOutgoingBitrate ?? null,
          availableIncomingBitrate: selectedPair.availableIncomingBitrate ?? null,
          connectionState: peer.connectionState,
          iceConnectionState: peer.iceConnectionState,
          iceGatheringState: peer.iceGatheringState
        };
      } catch (error) {
        return {
          status: "STATS_ERROR",
          error: safeStringify(error),
          connectionState: peer?.connectionState,
          iceConnectionState: peer?.iceConnectionState,
          iceGatheringState: peer?.iceGatheringState
        };
      }
    };

    const recordPath = async (reason) => {
      const path = await getPathInfo();
      event("WEBRTC_STATS", { reason, ...path });

      if (path?.status === "SELECTED") {
        if (path.path !== lastPath) {
          event("WEBRTC_PATH_CHANGED", {
            path: path.path,
            previousPath: lastPath,
            reason,
            localCandidateType: path.localCandidateType,
            remoteCandidateType: path.remoteCandidateType,
            relayProtocol: path.relayProtocol
          });
          lastPath = path.path;
        }

        event(
          path.path === "TURN / RELAY"
            ? "WEBRTC_PATH_TURN"
            : "WEBRTC_PATH_DIRECT",
          {
            reason,
            localCandidateType: path.localCandidateType,
            remoteCandidateType: path.remoteCandidateType,
            relayProtocol: path.relayProtocol
          }
        );
      }
    };

    const startStats = () => {
      if (statsTimer) clearInterval(statsTimer);
      statsTimer = setInterval(() => recordPath("PERIODIC_5S"), 5000);
      recordPath("CONNECTED");
    };

    const stopStats = () => {
      if (statsTimer) {
        clearInterval(statsTimer);
        statsTimer = null;
      }
    };

    const download = (reason = "GAME_OVER") => {
      if (downloaded) return;
      downloaded = true;
      event("DIAGNOSTIC_DOWNLOAD", { reason });

      const teamNumber = typeof team !== "undefined" ? team + 1 : "UNKNOWN";
      const roomCode = typeof room !== "undefined" ? room : "UNKNOWN";
      const stamp = new Date().toISOString().replace(/[:.]/g, "-");

      const header = [
        "FRIENDLY FEUD - PHONE DIAGNOSTIC LOG",
        "=====================================",
        `Generated: ${new Date().toString()}`,
        `Reason: ${reason}`,
        `Room: ${roomCode}`,
        `Team: ${teamNumber}`,
        "",
        "This file contains diagnostic events captured locally on the phone.",
        "No diagnostic data is sent to Cloudflare by this logger.",
        ""
      ].join("\n");

      const body = entries.map((item) =>
        `[${String(item.seq).padStart(5, "0")}] ${item.time} | ${item.category} | ${item.event} | DATA=${safeStringify(item.data)} | CONTEXT=${safeStringify(item.context)}`
      ).join("\n");

      const blob = new Blob([header + body + "\n"], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `FriendlyFeud_Team${teamNumber}_${roomCode}_${stamp}.txt`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    };

    return {
      event,
      recordPath,
      startStats,
      stopStats,
      download,
      getEntries: () => entries.slice()
    };
  })();

  FF_DIAGNOSTIC.event("DIAGNOSTIC_INITIALIZED", {
    version: "phone-full-test-logger-v1"
  });

  const SIGNALING_HOST = "friendly-feud-signaling.friendlyfeud.workers.dev";
  const RTC_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  };

  const params = new URLSearchParams(window.location.search);
  let room = params.get("room");
  let team = params.get("team");
  let name = params.get("name");
  let color = params.get("color");

  if (room) {
    room = room.toUpperCase();
    localStorage.setItem("feud_room", room);
    if (team !== null) localStorage.setItem("feud_team", team);
    if (name) localStorage.setItem("feud_name", name);
    if (color) localStorage.setItem("feud_color", color);
  } else {
    room = (localStorage.getItem("feud_room") || "").toUpperCase();
    team = localStorage.getItem("feud_team") || "0";
    name = localStorage.getItem("feud_name") || "Team " + (parseInt(team, 10) + 1);
    color = localStorage.getItem("feud_color") || "#3b82f6";
  }

  team = Number(team);

  FF_DIAGNOSTIC.event("PHONE_CONFIGURATION", {
    room,
    team: team + 1,
    name,
    color
  });

  if (!room || room.length !== 4 || (team !== 0 && team !== 1)) {
    document.getElementById("status-text").textContent = "Invalid room or team. Please scan QR again.";
    document.getElementById("conn-lbl").textContent = "Invalid";
    throw new Error("Invalid room/team");
  }

  document.documentElement.style.setProperty("--team-color", color);
  document.getElementById("room-lbl").textContent = room;
  document.getElementById("team-title").textContent = name;
  document.getElementById("team-title").style.color = color;

  const btn = document.getElementById("buzz-btn");
  const status = document.getElementById("status-text");
  const connLbl = document.getElementById("conn-lbl");

  let signalingWs = null;
  let peer = null;
  let channel = null;
  let candidateQueue = [];
  let remoteDescriptionSet = false;
  let reconnectTimer = null;
  let retryDelay = 1000;
  const MAX_RETRY_DELAY = 15000;

  let phoneArmed = false;
  let phoneBuzzed = false;

  // Prevent a phone rejected by the server from reconnecting repeatedly.
  let teamRejected = false;

  function setStandby(text = "Waiting for host...") {
    FF_DIAGNOSTIC.event("SET_STANDBY", { text });

    phoneArmed = false;
    phoneBuzzed = false;
    btn.disabled = true;
    btn.className = "";
    btn.textContent = "STANDBY";
    status.textContent = text;
  }

  function setArmed() {
    if (teamRejected) {
      FF_DIAGNOSTIC.event("ARM_IGNORED_TEAM_REJECTED");
      return;
    }

    FF_DIAGNOSTIC.event("ARM_RECEIVED");

    phoneArmed = true;
    phoneBuzzed = false;
    btn.disabled = false;
    btn.className = "armed";
    btn.textContent = "BUZZ!";
    status.textContent = "TAP NOW!";
    navigator.vibrate?.([80, 40, 80]);
  }

  function setLocked(winnerTeam) {
    FF_DIAGNOSTIC.event("LOCK_RECEIVED", {
      winnerTeam: Number(winnerTeam) + 1,
      thisTeam: team + 1
    });

    phoneArmed = false;
    btn.disabled = true;
    btn.classList.remove("armed", "countdown");

    if (Number(winnerTeam) === team) {
      btn.classList.add("winner");
      btn.textContent = "YOU BUZZED!";
      status.textContent = "You got in first! Answer now.";
      navigator.vibrate?.([100, 50, 100]);
    } else {
      btn.classList.remove("winner");
      btn.textContent = "LOCKED OUT";
      status.textContent = "Other team buzzed first!";
    }
  }

  function sendSignal(data) {
    if (!signalingWs || signalingWs.readyState !== WebSocket.OPEN) {
      FF_DIAGNOSTIC.event("SIGNAL_SEND_FAILED_WS_NOT_OPEN", { data });
      return false;
    }

    FF_DIAGNOSTIC.event("SIGNAL_SENT", { data });
    signalingWs.send(JSON.stringify({ type: "SIGNAL", team, data }));
    return true;
  }

  function closePeer() {
    FF_DIAGNOSTIC.event("PEER_CLOSE_REQUESTED", {
      hadPeer: !!peer,
      hadChannel: !!channel
    });

    FF_DIAGNOSTIC.stopStats();

    candidateQueue = [];
    remoteDescriptionSet = false;
    if (channel) {
      try { channel.close(); } catch (e) {}
    }
    channel = null;
    if (peer) {
      try { peer.close(); } catch (e) {}
    }
    peer = null;
  }

  async function createPhonePeer() {
    FF_DIAGNOSTIC.event("WEBRTC_CREATE_PEER_STARTED");

    closePeer();
    const turnResponse = await fetch(`https://${SIGNALING_HOST}/turn-credentials`);

    if (!turnResponse.ok) {
      throw new Error(`TURN credentials failed: ${turnResponse.status}`);
    }

    const turnData = await turnResponse.json();

    FF_DIAGNOSTIC.event("TURN_CREDENTIALS_RECEIVED", {
      ok: true,
      iceServerCount: Array.isArray(turnData?.iceServers)
        ? turnData.iceServers.length
        : null
    });

    peer = new RTCPeerConnection({
      iceServers: turnData.iceServers
    });

    FF_DIAGNOSTIC.event("WEBRTC_PEER_CREATED");

    peer.onicecandidate = (event) => {
      if (event.candidate) {
        FF_DIAGNOSTIC.event("ICE_CANDIDATE_LOCAL", {
          candidateType: event.candidate.type || null,
          protocol: event.candidate.protocol || null
        });
        sendSignal({ type: "candidate", candidate: event.candidate });
      }
    };

peer.oniceconnectionstatechange = () => {
    FF_DIAGNOSTIC.event("ICE_CONNECTION_STATE", {
      state: peer.iceConnectionState
    });
    console.log("Phone ICE state:", peer.iceConnectionState);

    if (
      peer.iceConnectionState === "connected" ||
      peer.iceConnectionState === "completed"
    ) {
      FF_DIAGNOSTIC.recordPath("ICE_CONNECTED_OR_COMPLETED");
    }
};

peer.onicegatheringstatechange = () => {
    FF_DIAGNOSTIC.event("ICE_GATHERING_STATE", {
      state: peer.iceGatheringState
    });
    console.log("Phone ICE gathering:", peer.iceGatheringState);
};

peer.onicecandidateerror = (event) => {
    FF_DIAGNOSTIC.event("ICE_CANDIDATE_ERROR", {
      errorCode: event.errorCode,
      url: event.url,
      errorText: event.errorText
    });
    console.error(
        "Phone ICE candidate ERROR:",
        event.errorCode,
        event.url,
        event.errorText
    );
};
    peer.onconnectionstatechange = () => {
      if (!peer) return;

      FF_DIAGNOSTIC.event("WEBRTC_CONNECTION_STATE", {
        state: peer.connectionState
      });

      console.log("Phone WebRTC state:", peer.connectionState);
      if (peer.connectionState === "connected") {
        FF_DIAGNOSTIC.event("WEBRTC_CONNECTED");
        FF_DIAGNOSTIC.startStats();

        connLbl.textContent = "WebRTC Connected";
        connLbl.style.color = "#22c55e";
        status.textContent = phoneArmed ? "TAP NOW!" : "Waiting for next question...";
      } else if (["failed", "disconnected", "closed"].includes(peer.connectionState)) {
        connLbl.textContent = "WebRTC Disconnected";
        connLbl.style.color = "#ef4444";
        if (!phoneArmed) status.textContent = "Reconnecting...";
      }
    };

    peer.ondatachannel = (event) => {
      channel = event.channel;

      FF_DIAGNOSTIC.event("DATACHANNEL_RECEIVED", {
        label: channel.label,
        readyState: channel.readyState
      });

      channel.onopen = () => {
        FF_DIAGNOSTIC.event("DATACHANNEL_OPEN", {
          label: channel.label,
          readyState: channel.readyState
        });
        FF_DIAGNOSTIC.startStats();

        connLbl.textContent = "WebRTC Connected";
        connLbl.style.color = "#22c55e";
        status.textContent = phoneArmed ? "TAP NOW!" : "Waiting for next question...";
      };

      channel.onmessage = (event) => {
        FF_DIAGNOSTIC.event("DATACHANNEL_MESSAGE_RECEIVED", {
          raw: event.data
        });
        handleGameMessage(event.data);
      };

      channel.onclose = () => {
        FF_DIAGNOSTIC.event("DATACHANNEL_CLOSE", {
          readyState: channel?.readyState
        });
        FF_DIAGNOSTIC.stopStats();

        channel = null;
        connLbl.textContent = "WebRTC Disconnected";
        connLbl.style.color = "#ef4444";
        if (!phoneArmed) status.textContent = "Reconnecting...";
      };

      channel.onerror = (error) => {
        FF_DIAGNOSTIC.event("DATACHANNEL_ERROR", {
          error: String(error)
        });
        console.error("Phone DataChannel error:", error);
      };
    };
  }

  async function flushCandidateQueue() {
    if (!peer || !remoteDescriptionSet) return;
    for (const candidate of candidateQueue) {
      try { await peer.addIceCandidate(candidate); } catch (e) {
        console.warn("Queued ICE candidate failed:", e);
      }
    }
    candidateQueue = [];
  }

  async function handleSignalMessage(msg) {
    if (msg.type !== "SIGNAL" || !msg.data) return;
    const data = msg.data;
    if (!peer) createPhonePeer();

    if (data.type === "offer" && data.offer) {
      FF_DIAGNOSTIC.event("SIGNAL_OFFER_RECEIVED");
      try {
        await peer.setRemoteDescription(data.offer);
        remoteDescriptionSet = true;
        await flushCandidateQueue();
        const answer = await peer.createAnswer();
        await peer.setLocalDescription(answer);
        FF_DIAGNOSTIC.event("WEBRTC_ANSWER_CREATED_AND_SENT");
        sendSignal({ type: "answer", answer: peer.localDescription });
      } catch (error) {
        FF_DIAGNOSTIC.event("WEBRTC_OFFER_ANSWER_ERROR", {
          error: String(error)
        });
        console.error("WebRTC offer/answer error:", error);
      }
      return;
    }

    if (data.type === "candidate" && data.candidate) {
      if (remoteDescriptionSet) {
        try {
          await peer.addIceCandidate(data.candidate);
          FF_DIAGNOSTIC.event("ICE_REMOTE_CANDIDATE_ADDED");
        } catch (error) {
          FF_DIAGNOSTIC.event("ICE_REMOTE_CANDIDATE_FAILED", {
            error: String(error)
          });
          console.warn("ICE candidate failed:", error);
        }
      } else {
        candidateQueue.push(data.candidate);
        FF_DIAGNOSTIC.event("ICE_REMOTE_CANDIDATE_QUEUED", {
          queueLength: candidateQueue.length
        });
      }
    }
  }

  function handleGameMessage(raw) {
    let msg;
    try {
      msg = JSON.parse(raw);
    } catch (e) {
      FF_DIAGNOSTIC.event("GAME_MESSAGE_PARSE_ERROR", {
        raw,
        error: String(e)
      });
      return;
    }

    FF_DIAGNOSTIC.event("GAME_MESSAGE_RECEIVED", { message: msg });
    if (msg.type === "ARM") {
      setArmed();
      return;
    }
    if (msg.type === "LOCK") {
      setLocked(msg.winnerTeam);
      return;
    }
    if (msg.type === "RESET") {
      FF_DIAGNOSTIC.event("RESET_RECEIVED");
      setStandby("Waiting for next question...");
      return;
    }

    if (
      msg.type === "GAME_OVER" ||
      msg.type === "END_GAME" ||
      msg.type === "GAME_END"
    ) {
      FF_DIAGNOSTIC.event("GAME_OVER_MESSAGE_RECEIVED", {
        message: msg
      });
      FF_DIAGNOSTIC.download("GAME_OVER_MESSAGE");
      return;
    }
  }

  function buzz() {
    if (teamRejected) {
      FF_DIAGNOSTIC.event("BUZZ_IGNORED_TEAM_REJECTED");
      return;
    }

    if (!phoneArmed) {
      FF_DIAGNOSTIC.event("BUZZ_IGNORED_NOT_ARMED");
      return;
    }

    if (phoneBuzzed) {
      FF_DIAGNOSTIC.event("BUZZ_IGNORED_ALREADY_BUZZED");
      return;
    }

    if (!channel || channel.readyState !== "open") {
      FF_DIAGNOSTIC.event("BUZZ_IGNORED_DATACHANNEL_NOT_OPEN", {
        readyState: channel?.readyState || null
      });
      return;
    }

    phoneBuzzed = true;

    FF_DIAGNOSTIC.event("BUZZ_SENT", {
      timestamp: Date.now()
    });
    phoneArmed = false;
    btn.disabled = true;

    channel.send(JSON.stringify({
      type: "BUZZ",
      team,
      timestamp: Date.now()
    }));
  }

  btn.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    buzz();
  });

  function connectSignaling() {
    if (teamRejected) {
      FF_DIAGNOSTIC.event("SIGNAL_CONNECT_IGNORED_TEAM_REJECTED");
      return;
    }

    FF_DIAGNOSTIC.event("SIGNAL_CONNECT_ATTEMPT", {
      room,
      team: team + 1
    });

    if (signalingWs && (signalingWs.readyState === WebSocket.OPEN || signalingWs.readyState === WebSocket.CONNECTING)) return;

    clearTimeout(reconnectTimer);
    connLbl.textContent = "Connecting...";
    connLbl.style.color = "";

    signalingWs = new WebSocket("wss://" + SIGNALING_HOST + "/?room=" + encodeURIComponent(room));

    signalingWs.onopen = () => {
      FF_DIAGNOSTIC.event("SIGNAL_WS_OPEN");

      if (teamRejected) {
        try { signalingWs.close(); } catch (e) {}
        return;
      }

      retryDelay = 1000;
      connLbl.textContent = "Signaling Connected";
      connLbl.style.color = "#22c55e";
      status.textContent = "Connecting buzzer...";

      const registration = {
        type: "REGISTER_PHONE",
        team,
        name
      };

      FF_DIAGNOSTIC.event("REGISTER_PHONE_SENT", {
        team: team + 1,
        name
      });

      signalingWs.send(JSON.stringify(registration));

      createPhonePeer();
    };

    signalingWs.onmessage = async (event) => {
      try {
        const msg = JSON.parse(event.data);

        FF_DIAGNOSTIC.event("SIGNAL_MESSAGE_RECEIVED", {
          message: msg
        });

        // Server rejected this phone because its team is already occupied.
        if (msg.type === "TEAM_OCCUPIED") {
          FF_DIAGNOSTIC.event("TEAM_OCCUPIED_REJECTED", {
            team: team + 1,
            message: msg
          });

          teamRejected = true;
          clearTimeout(reconnectTimer);
          closePeer();

          setStandby("Team " + (team + 1) + " is already connected.");
          connLbl.textContent = "Team Occupied";
          connLbl.style.color = "#ef4444";

          try { signalingWs.close(); } catch (e) {}
          return;
        }

        await handleSignalMessage(msg);
      } catch (error) {
        FF_DIAGNOSTIC.event("SIGNAL_MESSAGE_ERROR", {
          error: String(error)
        });
        console.error("Signaling message error:", error);
      }
    };

    signalingWs.onerror = (error) => {
      FF_DIAGNOSTIC.event("SIGNAL_WS_ERROR", {
        error: String(error)
      });
      console.error("Signaling error:", error);
      connLbl.textContent = "Signaling Error";
      connLbl.style.color = "#ef4444";
    };

    signalingWs.onclose = (event) => {
      FF_DIAGNOSTIC.event("SIGNAL_WS_CLOSE", {
        code: event?.code,
        reason: event?.reason,
        wasClean: event?.wasClean
      });

      closePeer();

      // Do NOT reconnect after the server has rejected this team.
      if (teamRejected) {
        connLbl.textContent = "Team Occupied";
        connLbl.style.color = "#ef4444";
        return;
      }

      connLbl.textContent = "Offline";
      connLbl.style.color = "#ef4444";
      if (!phoneArmed) status.textContent = "Reconnecting in " + (retryDelay / 1000).toFixed(0) + "s...";
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectSignaling, retryDelay);
      retryDelay = Math.min(retryDelay * 2, MAX_RETRY_DELAY);
    };
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      if (!teamRejected) connectSignaling();
      if ("wakeLock" in navigator) {
        navigator.wakeLock.request("screen")
          .then(() => FF_DIAGNOSTIC.event("WAKE_LOCK_ACQUIRED"))
          .catch((error) => FF_DIAGNOSTIC.event("WAKE_LOCK_FAILED", {
            error: String(error)
          }));
      }
    }
  });

  window.addEventListener("pageshow", () => {
    if (!teamRejected) connectSignaling();
  });

  window.addEventListener("online", () => {
    if (!teamRejected) connectSignaling();
  });

  if ("wakeLock" in navigator) {
    navigator.wakeLock.request("screen")
      .then(() => FF_DIAGNOSTIC.event("WAKE_LOCK_ACQUIRED_INITIAL"))
      .catch((error) => FF_DIAGNOSTIC.event("WAKE_LOCK_FAILED_INITIAL", {
        error: String(error)
      }));
  }

  setStandby();
  FF_DIAGNOSTIC.event("PHONE_READY");
  connectSignaling();

  // Testing fallback: if the host sends any explicit game-over message, the
  // handler above downloads immediately. The phone cannot reliably observe a
  // host-only DOM state, so no automatic download is triggered merely because
  // the phone page becomes hidden. This avoids false "game over" downloads.
</script>

</body>
</html>
